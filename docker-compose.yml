services:
  # ===== SnowLuma - QQ 协议桥接框架 =====
  snowluma:
    image: motricseven7/snowluma:latest
    container_name: snowluma
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      # 不提供默认密码，避免把公开凭据带入生产环境。
      # 启动前请设置 SNOWLUMA_VNC_PASSWORD（建议使用随机强密码）。
      VNC_PASSWD: ${SNOWLUMA_VNC_PASSWORD:?Set SNOWLUMA_VNC_PASSWORD to a strong password}
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_WEBUI_HOST: "0.0.0.0"
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_SCREEN: "1920x1080x24"
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: >-
        --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
    ports:
      - "6081:6081" # noVNC
      - "5099:5099" # SnowLuma WebUI
      - "3000:3000" # OneBot HTTP
      - "3001:3001" # OneBot WebSocket
    volumes:
      - snowluma-data:/app/data
      - snowluma-config:/app/.config
      - snowluma-local:/app/.local/share

  # ===== Neo-MoFox - AI 聊天机器人框架 (dev 分支) =====
  # 在 SnowLuma WebUI 中将反向 WebSocket 地址设为 ws://mofox-bot:8095
  mofox:
    image: ikun11451/neo-mofox-dev:latest
    container_name: mofox-bot
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./plugins:/app/plugins
      - ./eula.md:/app/eula.md
      - ./PRIVACY.md:/app/PRIVACY.md
      - ./LICENSE:/app/LICENSE
    environment:
      TZ: Asia/Shanghai
      MOFOX_ACCEPT_STARTUP_AGREEMENTS: "1"
    ports:
      - "8000:8000" # MoFox WebUI
    stdin_open: true
    tty: true

volumes:
  snowluma-data:
    name: snowluma-data
  snowluma-config:
    name: snowluma-config
  snowluma-local:
    name: snowluma-local
