<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Engram · 记忆档案</title>
  <style>
    :root{color-scheme:light;--navy:#192c35;--navy2:#2a424a;--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;--mono:"Cascadia Code","SFMono-Regular",Consolas,monospace}

    .memory-open:focus-visible{outline:2px solid #a8814f;outline-offset:2px}.memory-open{margin-top:9px}
    .empty,.error,.loading{text-align:center}.loading:before{display:inline-block;width:12px;height:12px;margin-right:7px;border:1px solid #b9aa91;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite;content:""}
    .persona-grid{display:grid}.persona{margin:0}.persona h3{overflow-wrap:anywhere}.persona-id{margin:-2px 0 9px}.mono{font:10px var(--mono);overflow-wrap:anywhere}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1050px){.band-side{flex-wrap:wrap}}
    @media(max-width:720px){.split{grid-template-columns:1fr}.detail{min-height:220px;padding:16px}}
    :root{--ink:#202a2c;--muted:#697578;--line:#dce2df;--paper:#f5f7f6;--white:#fff;--teal:#147d73;--teal-soft:#e7f3f0;--coral:#bb5b45;--coral-soft:#fbefeb;--blue:#496c9c;--blue-soft:#edf2f9;--sans:"Microsoft YaHei UI","Noto Sans CJK SC","Segoe UI",sans-serif;--display:"Aptos Display","Trebuchet MS","Microsoft YaHei UI",sans-serif;letter-spacing:0}
    *{letter-spacing:0}body{background:var(--paper);color:var(--ink);font-family:var(--sans)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    .layout{grid-template-columns:210px minmax(0,1fr)}aside{padding:20px 12px;border-right:1px solid var(--line);background:#fff;color:var(--ink)}aside:after{display:none}.brand{padding:0 7px 15px}.seal{display:grid;width:34px;height:34px;place-items:center;border:0;border-radius:4px;background:var(--teal);color:white;font:inherit;transform:none}.brand strong{font:600 17px/1.2 var(--display);letter-spacing:0}.brand small{color:var(--muted);font-size:10px;letter-spacing:0}.rail-label{color:var(--muted);letter-spacing:0}nav{gap:3px}.nav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:4px;color:#4d595b;text-align:left}.nav:hover{background:#f1f5f3;color:var(--ink)}.nav[aria-current=page]{border-color:transparent;background:var(--teal-soft);color:#09685f}.glyph{display:inline-grid;width:18px;place-items:center;color:var(--teal);font:inherit}.rail-foot{border-color:var(--line);color:var(--muted)}.rail-foot strong{color:var(--ink)}

    .detail{min-height:330px;padding:15px}.detail-head{padding-bottom:12px}.detail-head h2{margin:0;font:600 19px/1.35 var(--display)}.detail-section{margin-top:15px}.detail-section h3{font:600 12px var(--sans);letter-spacing:0;text-transform:none}.detail-section h3:after{background:var(--line)}.body{color:var(--ink);font-size:13px;line-height:1.8}.revision,.source,.persona{margin-top:0;padding:10px 0;border:0;border-top:1px solid #edf0ee;border-radius:0;background:transparent}.snapshot{background:#f5f8f6;border-color:#91b1a8}
    .empty,.error,.loading{padding:24px 13px;color:var(--muted);font-size:12px}.error{color:#9d4536;background:var(--coral-soft)}.persona-grid{grid-template-columns:1fr;gap:0}.persona{padding:12px 0;border-top:1px solid var(--line)}.persona h3{font:600 15px var(--display)}.persona-id{color:var(--muted)}.pager{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.pager-controls{display:flex;align-items:center;gap:5px}.icon-button{display:inline-grid;min-width:30px;min-height:30px;place-items:center;padding:5px;border:1px solid var(--line);border-radius:4px;background:white}.icon-button svg{width:16px;height:16px}.jump-input{width:52px;height:29px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;text-align:center}.fold,.identity{border-top:1px solid var(--line)}.fold summary,.identity summary{padding:10px 0;color:#435153;font-size:12px;font-weight:600;cursor:pointer}.fold-content{padding:0 0 10px}.source-row,.revision-row,.relation-row{padding:10px 0;border-top:1px solid #edf0ee}.row-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}.row-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;color:var(--muted);font-size:10px}.source-quote{margin:7px 0 0;padding:8px 10px;border-left:2px solid #b4c5bf;background:#f5f8f6;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.identity-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:5px 0;border-top:1px solid #edf0ee}.identity-row code{min-width:0;overflow-wrap:anywhere;font:10px var(--mono)}.copy-feedback{min-height:17px;font-size:10px}.circle-ref{color:var(--blue);font-weight:700;text-decoration:none}.memory-ref-list{display:grid;gap:5px}.mobile-back{display:none}.copy-feedback{color:var(--teal)}.toast{position:fixed;right:18px;bottom:18px;z-index:5;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:white;box-shadow:0 3px 14px #1d34301a;font-size:12px}.toast.error-toast{border-color:#efcfc7;color:#973f31}
    .command{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:33px;padding:5px 9px;border:1px solid #bfd0ca;border-radius:4px;background:white;color:#315e56;font-size:12px}.command:hover{background:#f2f8f6}.command svg{width:15px;height:15px}.command.primary{border-color:var(--teal);background:var(--teal);color:white}.command.primary:hover{background:#0f6b63}.memory-open{display:inline-flex;align-items:center;gap:6px;min-height:30px;max-width:100%;padding:4px 8px;border:1px solid #bfd0ca;border-radius:4px;background:#f2f8f6;color:#116c64;font-size:11px;overflow-wrap:anywhere}.memory-open svg{width:14px;height:14px;flex:none}.memory-open:hover{border-color:#91aaa3;background:white}.unavailable{color:var(--coral);font-size:10px}.list{max-height:calc(100vh - 310px);overflow-y:auto;overscroll-behavior:contain}
    @media(max-width:1050px){main{padding-right:17px;padding-left:17px}.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}.split{grid-template-columns:minmax(280px,.85fr) minmax(0,1.15fr)}.band{grid-template-columns:minmax(0,1fr) auto}}
    @media(max-width:720px){.layout{display:block}aside{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 2px 9px}.brand strong{font-size:16px}.rail-label,.rail-foot{display:none}nav{display:flex;overflow-x:auto;gap:3px}.nav{flex:none;width:auto;padding:7px 9px;font-size:12px}.glyph{width:18px}main{padding:0 12px 25px}.topline{min-height:48px}#view{padding-top:15px}.heading{align-items:flex-start;margin-bottom:12px}h1{font-size:21px}.split{display:block}.split>.panel:first-child{display:block}.split>.panel.detail{display:none;min-height:220px;padding:12px}.split.show-detail>.panel:first-child{display:none}.split.show-detail>.panel.detail{display:block}.detail-back{display:inline-flex}.persona-grid{grid-template-columns:1fr}.overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.stat{min-height:78px;padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.stat:nth-child(2n){border-right:0}.stat:last-child{border-bottom:0}.stat strong{font-size:23px}.band{grid-template-columns:1fr}.band-side{gap:15px}.filters{padding:8px}.filters input{flex:1 1 120px}.filters select{max-width:130px}.pager{flex-wrap:wrap}.mobile-back{display:inline-flex}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="seal" data-icon="Fingerprint" aria-hidden="true"></span><span><strong>Engram</strong><small>记忆档案</small></span></div>
      <p class="rail-label">档案目录</p>
      <nav aria-label="档案栏目">
        <button class="nav" type="button" data-view="overview"><span class="glyph" data-icon="ChartNoAxesCombined" aria-hidden="true"></span>概览</button>
        <button class="nav" type="button" data-view="memories"><span class="glyph" data-icon="BookOpen" aria-hidden="true"></span>记忆</button>
        <button class="nav" type="button" data-view="personas"><span class="glyph" data-icon="UsersRound" aria-hidden="true"></span>人物</button>
      </nav>
      <div class="rail-foot"><strong>只读档案</strong><span id="rail-count">正在读取…</span></div>
    </aside>
    <main>
      <div class="topline"><span class="crumb">Engram / <span id="crumb">正式记忆</span></span><div class="top-actions"><span class="local">本机访问</span><button class="refresh" id="refresh" aria-label="刷新" title="刷新"><span data-icon="RefreshCw" aria-hidden="true"></span></button></div></div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/engram-memory/assets/icons.js"></script>
  <script>
    "use strict";
    const root=document.getElementById("view"),crumb=document.getElementById("crumb"),toast=document.getElementById("toast");
    const titles={overview:"概览",memories:"记忆",personas:"人物"};
    const state={view:"memories",memory:{q:"",status:"ACTIVE",page:1,limit:20,id:null,scrollTop:0},persona:{q:"",sort:"recent",page:1,limit:20,id:null,scrollTop:0}};
    const labels={ACTIVE:"有效",TOMBSTONED:"已作废",MERGED:"已合并",FACT:"事实",EVENT:"经历",PREFERENCE:"偏好",RELATIONSHIP:"关系",COMMITMENT:"约定",PERSONAL_STATE:"个人状态",SOCIAL_PATTERN:"社交模式",INITIAL:"初次记录",DEVELOPMENT:"经历发展",CORRECTION:"更正",CLARIFICATION:"澄清",NEW_EVIDENCE:"补充来源",EXPLICIT_CORRECTION:"明确更正",ADMIN_CORRECTION:"管理员更正",MIGRATION_REWRITE:"迁移整理",CHAT_MESSAGE:"聊天消息",LEGACY_IMPORT:"历史导入",MESSAGE_SET:"原始消息",ACTOR_WRITE:"主动记忆",SYSTEM_EVENT:"系统事件",LEGACY_RECORD:"历史记录",ADMIN:"管理员",EXTERNAL:"外部来源",AVAILABLE:"来源可读取",REDACTED:"来源已隐私删除",NOT_CAPTURED:"来源缺失",UNKNOWN:"未知"};
    let renderToken=0,detailToken=0,toastTimer=0;
    function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined&&text!==null)node.textContent=String(text);return node}
    function icon(name){const node=window.lucide&&window.lucide.icons&&window.lucide.icons[name];return node?window.lucide.createElement(node):el("span")}
    function paintIcons(scope=document){for(const holder of scope.querySelectorAll("[data-icon]"))holder.replaceChildren(icon(holder.dataset.icon))}
    function label(value){return labels[value]||value||"未知"}
    function formatDate(value){if(value===null||value===undefined||value==="")return "时间未记录";const parsed=new Date(typeof value==="number"?value*1000:value);return Number.isNaN(parsed.getTime())?String(value):new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(parsed)}
    function badge(value){const kind=String(value||"UNKNOWN"),cls=kind==="ACTIVE"?"badge good":kind==="TOMBSTONED"?"badge bad":kind==="MERGED"?"badge blue":"badge";return el("span",cls,label(kind))}
    function personName(person){if(!person)return "人物未记录";const candidates=[person.display_name,person.nickname,person.subject_label,person.label],name=candidates.find(value=>value&&value!==person.person_id&&!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(String(value)));return name||"人物未命名"}
    function showToast(text,isError=false){toast.textContent=text;toast.className=isError?"toast error-toast":"toast";toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},2600)}
    async function api(path){const response=await fetch(path,{headers:{Accept:"application/json"},cache:"no-store",credentials:"same-origin"});let data;try{data=await response.json()}catch{throw new Error("服务器返回了无法读取的数据。")};if(!response.ok)throw new Error(data.detail||("请求失败（"+response.status+"）"));if(data&&data.ok===false)throw new Error(data.detail||data.error||"请求未成功。");return data}
    function empty(parent,text){parent.replaceChildren(el("div","empty",text))}
    function makeHeading(title,description,side){const heading=el("div","page-heading"),copy=el("div");copy.append(el("h1","",title));if(description)copy.append(el("p","",description));heading.append(copy);if(side)heading.append(side);return heading}
    function section(parent,title,id){const area=el("section","section");if(id)area.id=id;area.append(el("h3","",title));parent.append(area);return area}
    function button(text,iconName,cls,onClick,title){const item=el("button","command"+(cls?" "+cls:""));item.type="button";if(title){item.title=title;item.setAttribute("aria-label",title)}if(iconName)item.append(icon(iconName));if(text)item.append(el("span","",text));item.addEventListener("click",onClick);return item}
    function iconButton(iconName,title,onClick,disabled=false){const item=el("button","icon-button");item.type="button";item.title=title;item.setAttribute("aria-label",title);item.disabled=disabled;item.append(icon(iconName));item.addEventListener("click",onClick);return item}
    function snapshot(){return JSON.parse(JSON.stringify(state))}
    function hashFor(current){const params=new URLSearchParams({view:current.view});if(current.view==="memories"){const item=current.memory;params.set("q",item.q);params.set("status",item.status);params.set("page",String(item.page));params.set("limit",String(item.limit));if(item.id)params.set("id",item.id)}else if(current.view==="personas"){const item=current.persona;params.set("q",item.q);params.set("sort",item.sort);params.set("page",String(item.page));params.set("limit",String(item.limit));if(item.id)params.set("id",item.id)}return "#"+params.toString()}
    function commit(){history.pushState({snapshot:snapshot()},"",hashFor(state));syncNavigation();render()}
    function syncNavigation(){crumb.textContent=titles[state.view];for(const nav of document.querySelectorAll("[data-view]")){if(nav.dataset.view===state.view)nav.setAttribute("aria-current","page");else nav.removeAttribute("aria-current")}}

    function readHash(){const params=new URLSearchParams(location.hash.slice(1)),view=params.get("view");if(!titles[view])return;state.view=view;if(view==="memories"||view==="personas"){const item=state[view==="memories"?"memory":"persona"];item.q=params.get("q")||"";item.page=Math.max(1,Number(params.get("page"))||1);item.limit=[20,50,100].includes(Number(params.get("limit")))?Number(params.get("limit")):20;item.id=params.get("id")||null;if(view==="memories")item.status=params.get("status")||"ACTIVE";else item.sort=params.get("sort")==="name"?"name":"recent"}}
